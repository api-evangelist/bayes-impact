aid: bayes-impact
name: Bayes Impact
description: Bayes Impact is a nonprofit organization that builds open-source AI and
  data-science tools for public services, governments, and nonprofits, with a mission
  to empower people in need and those who help them. Surfaced through Y Combinator,
  it has served over 10 million beneficiaries across three continents. Its flagship
  open-source project, Bob (formerly Bob Emploi), delivers personalized, data-driven
  career and job-search advice to jobseekers through a Python/Flask RESTful JSON API
  whose data structures are defined in Protocol Buffers. Other projects include the
  Bayes Platform agent framework for public services, the Encompass geographic-access
  analysis tool, and a range of civic data-science tooling.
